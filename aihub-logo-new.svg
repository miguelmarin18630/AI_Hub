<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#a277ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7c5cff" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Main shape: stylized letter A with AI motif -->
  <path d="M 30 180 Q 70 120 110 160 Q 150 100 170 180" fill="url(#grad1)" filter="url(#shadow)"/>
  <!-- Central AI motif: hexagonal pattern -->
  <polygon points="100,50 120,70 120,90 100,110 80,90 80,70" fill="#ffffff" opacity="0.9"/>
  <!-- Bottom accent -->
  <path d="M 30 180 Q 50 160 80 180 Q 110 170 150 180" fill="#ffffff" opacity="0.3"/>
  <!-- Left accent -->
  <path d="M 30 180 Q 50 140 70 120" fill="#ffffff" opacity="0.3"/>
</svg>